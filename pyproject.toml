[project]
name = "fastapi-query-filters"
dynamic = ["version"]
description = "Dynamic and declarative query filters for FastAPI, powered by Pydantic v2 and ready for multiple ORMs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ezequiel Parziale"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic[email]>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/ezeparziale/fastapi-query-filters"
Documentation = "https://github.com/ezeparziale/fastapi-query-filters#readme"
Repository = "https://github.com/ezeparziale/fastapi-query-filters"
Issues = "https://github.com/ezeparziale/fastapi-query-filters/issues"
Changelog = "https://github.com/ezeparziale/fastapi-query-filters/releases"

[tool.hatch.version]
source = "vcs"

[project.optional-dependencies]
all = [
    "sqlalchemy>=2.0.0",
]
sqlalchemy = [
    "sqlalchemy>=2.0.0",
]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "uvicorn",
    "httpx",
    "pre-commit",
    "mypy",
    "types-setuptools",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--cov=fastapi_query_filters",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fastapi_query_filters"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]
